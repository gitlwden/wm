name: Seed Social Velocity\non:\n schedule:\n # Every hour - matches Reddit API rate limits\n - cron: '0 * * * *'\n workflow_dispatch:\n\njobs:\n seed:\n runs-on: ubuntu-latest\n timeout-minutes: 10\n steps:\n - uses: actions/checkout@v4\n\n - uses: actions/setup-node@v4\n with:\n node-version: '22'\n cache: 'npm'\n\n - run: npm ci\n\n - name: Seed Social Velocity (Reddit)\n id: seed-social-velocity\n run: node scripts/seed-social-velocity.mjs || echo "Warning: SocialVelocity seed failed (may be rate limited)"\n continue-on-error: true\n env:\n UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}\n UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}\n\n