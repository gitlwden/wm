name: Seed Social Velocity

on:
  schedule:
    # Every hour — matches Reddit API rate limits
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

  - name: Seed Social Velocity (Reddit)
    id: seed-social-velocity
    run: node scripts/seed-social-velocity.mjs || echo "Warning: SocialVelocity seed failed (may be rate limited)"
    continue-on-error: true
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
