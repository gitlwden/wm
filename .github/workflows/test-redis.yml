name: Test Redis Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          echo "URL: $UPSTASH_REDIS_REST_URL"
          echo "URL length: ${#UPSTASH_REDIS_REST_URL}"
          echo "Token length: ${#UPSTASH_REDIS_REST_TOKEN}"
          echo "Token first 10: ${UPSTASH_REDIS_REST_TOKEN:0:10}"
          echo "---"
          # Test GET
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            "$UPSTASH_REDIS_REST_URL/get/research:tech-events:v1" | head -5
          echo "---"
          # Test pipeline
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '[["GET","research:tech-events:v1"]]' \
            "$UPSTASH_REDIS_REST_URL/pipeline" | head -5
          echo "---"
          # Test SET
          curl -s -w "\nHTTP Status: %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '["SET","test:gh-actions-check","ok","EX","60"]' \
            "$UPSTASH_REDIS_REST_URL/set/test:gh-actions-check"
