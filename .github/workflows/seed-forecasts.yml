name: Seed AI Forecasts

on:
  schedule:
    # Every 6h — AI forecast pipeline (LLM-heavy, expensive)
    - cron: '7 */6 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Seed AI forecasts
        run: node scripts/seed-forecasts.mjs
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORECAST_LLM_PROVIDER_ORDER: ${{ secrets.FORECAST_LLM_PROVIDER_ORDER }}
          FORECAST_LLM_MODEL_OPENROUTER: ${{ secrets.FORECAST_LLM_MODEL_OPENROUTER }}
          FORECAST_LLM_COMBINED_PROVIDER_ORDER: ${{ secrets.FORECAST_LLM_COMBINED_PROVIDER_ORDER }}
          FORECAST_LLM_COMBINED_MODEL_OPENROUTER: ${{ secrets.FORECAST_LLM_COMBINED_MODEL_OPENROUTER }}
          FORECAST_LLM_CRITICAL_PROVIDER_ORDER: ${{ secrets.FORECAST_LLM_CRITICAL_PROVIDER_ORDER }}
          FORECAST_LLM_CRITICAL_MODEL_OPENROUTER: ${{ secrets.FORECAST_LLM_CRITICAL_MODEL_OPENROUTER }}
          FORECAST_LLM_IMPACT_PROVIDER_ORDER: ${{ secrets.FORECAST_LLM_IMPACT_PROVIDER_ORDER }}
          FORECAST_LLM_IMPACT_MODEL_OPENROUTER: ${{ secrets.FORECAST_LLM_IMPACT_MODEL_OPENROUTER }}
          FORECAST_LLM_MARKET_IMPLICATIONS_PROVIDER_ORDER: ${{ secrets.FORECAST_LLM_MARKET_IMPLICATIONS_PROVIDER_ORDER }}
          FORECAST_LLM_MARKET_IMPLICATIONS_MODEL_OPENROUTER: ${{ secrets.FORECAST_LLM_MARKET_IMPLICATIONS_MODEL_OPENROUTER }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
