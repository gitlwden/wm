name: Seed Energy Sources (Daily Bundle)

on:
  schedule:
    # Daily 07:30 UTC — matches Railway seed-bundle-energy-sources
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Seed energy sources bundle
        run: node scripts/seed-bundle-energy-sources.mjs
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIEAGSI_API_KEY }}
          AGSI_API_KEY: ${{ secrets.GIEAGSI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
