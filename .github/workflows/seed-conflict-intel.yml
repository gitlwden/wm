name: Seed Conflict & Intel

on:
  schedule:
    # Every 6h — conflict intel, GDELT, Iran events, unrest
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Refresh proxies
        id: proxy
        run: |
          node scripts/refresh-proxies.mjs 2>&1 | tee proxy-output.log
          node -e "
          const fs = require('fs');
          const lines = fs.readFileSync('proxy-output.log','utf8').split('\n');
          const jsonLine = lines.find(l => l.startsWith('__JSON__'));
          if (!jsonLine) { console.log('No proxy found, using existing'); process.exit(0); }
          const d = JSON.parse(jsonLine.replace(/__JSON__/g, ''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_url=' + d.proxy_url + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_pool=' + JSON.stringify(d.pool) + '\n');
          "
        continue-on-error: true
        timeout-minutes: 3

      - name: Seed conflict intel
        run: node scripts/seed-conflict-intel.mjs
        continue-on-error: true
        env:
          PROXY_URL: ${{ steps.proxy.outputs.proxy_url || secrets.PROXY_URL }}
          PROXY_POOL: ${{ steps.proxy.outputs.proxy_pool || secrets.PROXY_POOL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed GDELT intel
        run: node scripts/seed-gdelt-intel.mjs
        continue-on-error: true
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Scrape Iran events
        run: node scripts/scrape-iran-events.mjs
        continue-on-error: true
        timeout-minutes: 2

      - name: Seed Iran events
        run: node scripts/seed-iran-events.mjs
        continue-on-error: true
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed unrest events
        run: node scripts/seed-unrest-events.mjs
        continue-on-error: true
        timeout-minutes: 10
        env:
          PROXY_URL: ${{ steps.proxy.outputs.proxy_url || secrets.PROXY_URL }}
          PROXY_POOL: ${{ steps.proxy.outputs.proxy_pool || secrets.PROXY_POOL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
