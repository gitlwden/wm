name: Refresh Free Proxies

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and test proxies
        id: proxies
        run: |
          node scripts/refresh-proxies.mjs 2>&1 | tee proxy-output.log
          node -e "
          const fs = require('fs');
          const lines = fs.readFileSync('proxy-output.log','utf8').split('\n');
          const jsonLine = lines.find(l => l.startsWith('__JSON__'));
          if (!jsonLine) { console.error('No JSON output found'); process.exit(1); }
          const d = JSON.parse(jsonLine.replace(/__JSON__/g, ''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_url=' + d.proxy_url + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_pool=' + JSON.stringify(d.pool) + '\n');
          console.log('proxy_url=' + d.proxy_url);
          console.log('proxy_pool count=' + d.pool.length);
          "

      - name: Update repo variable
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh variable set PROXY_URL --body "${{ steps.proxies.outputs.proxy_url }}"
          gh variable set PROXY_POOL --body '${{ steps.proxies.outputs.proxy_pool }}'
          echo "Updated PROXY_URL=${{ steps.proxies.outputs.proxy_url }}"
