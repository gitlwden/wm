name: Seed Energy Data

on:
  schedule:
    # Every 12h — energy economy, petroleum, Hormuz, energy intelligence
    - cron: '7 8 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Refresh proxies
        id: proxy
        run: |
          node scripts/refresh-proxies.mjs 2>&1 | tee proxy-output.log
          node -e "
          const fs = require('fs');
          const lines = fs.readFileSync('proxy-output.log','utf8').split('\n');
          const jsonLine = lines.find(l => l.startsWith('__JSON__'));
          if (!jsonLine) { console.log('No proxy found, using existing'); process.exit(0); }
          const d = JSON.parse(jsonLine.replace(/__JSON__/g, ''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_url=' + d.proxy_url + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proxy_pool=' + JSON.stringify(d.pool) + '\n');
          "
        continue-on-error: true
        timeout-minutes: 3

      - name: Seed economy (EIA prices + FRED + crude/natgas inventories + macro signals)
        run: node scripts/seed-economy.mjs
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed EIA petroleum
        run: node scripts/seed-eia-petroleum.mjs
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed Hormuz tracker
        run: node scripts/seed-hormuz.mjs
        continue-on-error: true
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed energy intelligence
        run: node scripts/seed-energy-intelligence.mjs
        continue-on-error: true
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
