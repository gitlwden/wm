name: Relay Keep-Alive

# Ping Render AIS Relay every 10 minutes to prevent free-tier sleep.
# Render free instances sleep after 15 min of no incoming requests.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping relay health endpoint
        run: curl -sf --max-time 10 "$RELAY_HEALTH_URL" || echo "ping failed (relay may be deploying)"
        env:
          RELAY_HEALTH_URL: ${{ secrets.RELAY_HEALTH_URL }}
